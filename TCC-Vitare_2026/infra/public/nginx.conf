events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  client_max_body_size 2m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $http_cf_connecting_ip $vitare_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
  }

  map $http_x_forwarded_proto $vitare_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
  }

  upstream vitare_public_api {
    server api:3000;
    keepalive 32;
  }

  log_format vitare_public '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_cf_connecting_ip"';

  access_log /var/log/nginx/access.log vitare_public;
  error_log /var/log/nginx/error.log warn;

  # Rejeita Host headers desconhecidos.
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 80;
    server_name vitare.app.br;

    # Diretório onde o Dockerfile.web copia os builds
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }

    location = /monitoramento {
      return 301 /monitoramento/;
    }

    location ^~ /monitoramento/assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /monitoramento/ {
      try_files $uri $uri/ /monitoramento/index.html;
      add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.json {
      try_files $uri =404;
      add_header Cache-Control "no-cache";
    }

    location = /sw.js {
      try_files $uri =404;
      add_header Cache-Control "no-cache";
    }

    location /api/ {
      proxy_pass http://vitare_public_api;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $vitare_client_ip;
      proxy_set_header X-Forwarded-For $vitare_client_ip;
      proxy_set_header X-Forwarded-Proto $vitare_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header CF-Connecting-IP $vitare_client_ip;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering off;

      add_header Cache-Control "no-store" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}