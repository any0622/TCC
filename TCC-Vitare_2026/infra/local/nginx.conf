events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  client_max_body_size 2m;

  upstream vitare_api {
    server api:3000;
    keepalive 32;
  }

  log_format vitare '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log vitare;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 80;
    server_name _;

    location = /healthz {
      access_log off;
      return 200 'ok\n';
      add_header Content-Type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/vitare.crt;
    ssl_certificate_key /etc/nginx/certs/vitare.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
      access_log off;
      return 200 'ok\n';
      add_header Content-Type text/plain;
    }

    location /api/ {
      proxy_pass http://vitare_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering off;
      add_header Cache-Control "no-store" always;
    }

    # The staff application is a conventional web app. It has no manifest or
    # service worker and is mounted under a separate Vite base path.
    location = /monitoramento {
      return 301 /monitoramento/;
    }

    location /monitoramento/assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /monitoramento/ {
      try_files $uri $uri/ /monitoramento/index.html;
      add_header Cache-Control "no-cache";
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.json {
      try_files $uri =404;
      add_header Cache-Control "no-cache";
    }

    location = /sw.js {
      try_files $uri =404;
      add_header Cache-Control "no-cache";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}